dependencies {
    implementation project(":core:common-module")
    implementation project(":core:persistence-module")
    implementation project(":core:security-module")
    implementation project(":core:redis-module")

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring MVC
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // MySQL JDBC
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Spring Security 기본 (FilterChain, @PreAuthorize 등)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Eureka Client for Service Discovery (Eureka 클라이언트)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // WelFlux
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // SpringDoc (swagger - openapi 3.0)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
}