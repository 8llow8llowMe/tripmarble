# .github/workflows/mobile-android-build.yml
name: Mobile Android Build

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]
    branches: [develop, main]
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/mobile-android-build.yml'

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'frontend-mobile') || contains(github.event.pull_request.labels.*.name, 'mobile')
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk
      GRADLE_OPTS: -Xmx6144m -XX:MaxMetaspaceSize=2048m
      NODE_OPTIONS: --max-old-space-size=4096
      ANDROID_NDK_VERSION: 27.1.12297006
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      # 0. 오래된 아티팩트 자동 정리 (빌드 시작 전)
      - name: Cleanup old artifacts (auto)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const daysToKeep = 3; // 3일 이상된 아티팩트 자동 삭제
            const now = new Date();
            const per_page = 100;
            let deleted = 0;

            for await (const response of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page }
            )) {
              for (const artifact of response.data) {
                const created = new Date(artifact.created_at);
                const ageDays = (now - created) / (1000 * 60 * 60 * 24);
                if (ageDays > daysToKeep) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  deleted++;
                  core.info(`Deleted ${artifact.name} (${ageDays.toFixed(1)} days old)`);
                }
              }
            }

            core.info(`Cleanup complete. Deleted ${deleted} artifacts.`);

      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # 2. Node.js 설치 및 Yarn 캐시
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'frontend/mobile/yarn.lock'

      # 3. Gradle 캐시
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 4. Node_modules 캐시
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: frontend/mobile/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/mobile/yarn.lock') }}
          restore-keys: ${{ runner.os }}-node-

      # 5. Android NDK 캐시
      - name: Cache Android NDK
        uses: actions/cache@v3
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk
          key: ${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}

      # 6. Java 설치
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 7. Android SDK 설치
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          cmake-version: 3.22.1

      # 8. Yarn 의존성 설치
      - name: Install dependencies
        working-directory: frontend/mobile
        run: yarn install --frozen-lockfile

      # 9. 빌드 타입 및 환경 설정
      - name: Setup build environment
        working-directory: frontend/mobile
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            BUILD_TYPE="release"
            APP_ENV="production"
          else
            BUILD_TYPE="debug"
            APP_ENV="development"
          fi
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "APP_ENV=$APP_ENV" >> $GITHUB_ENV

      # 10. Keystore 복원
      - name: Restore Keystore
        working-directory: frontend/mobile
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/tripmarble-release-key.jks
          ls -lh android/app/tripmarble-release-key.jks

      # 11. signingConfig 검증
      - name: Verify signing config
        working-directory: frontend/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew signingReport --no-daemon --parallel

      # 12. 버전 코드/네임 설정
      - name: Set version code and name
        run: |
          VERSION_CODE=$((10000 + $GITHUB_RUN_NUMBER))
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            VERSION_NAME=$(git describe --tags --abbrev=0)
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      # 13. 안드로이드 빌드
      - name: Build Android
        working-directory: frontend/mobile/android
        env:
          APP_ENV: ${{ env.APP_ENV }}
        run: |
          chmod +x gradlew

          if [ "${{ env.BUILD_TYPE }}" = "release" ]; then
            BUILD_TASK="bundleRelease"
            OUTPUT_PATH="app/build/outputs/bundle/release/app-release.aab"
            ./gradlew clean $BUILD_TASK \
              -PversionCode=${{ env.VERSION_CODE }} \
              -PversionName=${{ env.VERSION_NAME }} \
              --no-daemon --parallel --stacktrace -x test -x lint -x check -x verify
          else
            BUILD_TASK="assembleDebug"
            OUTPUT_PATH="app/build/outputs/apk/debug/app-debug.apk"
            ./gradlew $BUILD_TASK \
              -PversionCode=${{ env.VERSION_CODE }} \
              -PversionName=${{ env.VERSION_NAME }} \
              --no-daemon --parallel --stacktrace -x test -x lint -x check -x verify
          fi

          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "✗ Build failed"
            exit 1
          fi

          echo "✓ Build successful"
          ls -lh "$OUTPUT_PATH"
          echo "OUTPUT_PATH=$OUTPUT_PATH" >> $GITHUB_ENV

      # 14. APK 업로드 (Debug 전용)
      - name: Upload APK (Debug)
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.event.number }}
          path: frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 15. AAB 업로드 (Release 전용)
      - name: Upload AAB (Release)
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.event.number }}
          path: frontend/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # 16. Google Play 업로드 (Configurable Track)
      - name: Deploy to Google Play (Open Track)
        if: env.BUILD_TYPE == 'release' && github.base_ref == 'main'
        working-directory: frontend/mobile
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
          gem install fastlane --no-document --user-install
          echo "$HOME/.gem/ruby/3.2.0/bin" >> $GITHUB_PATH

          echo "Deploying to track: $PLAY_TRACK"

          fastlane supply \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track $PLAY_TRACK \
            --json_key google-play-service-account.json \
            --package_name com.followfollowme.tripmarble \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots

          rm -f google-play-service-account.json
