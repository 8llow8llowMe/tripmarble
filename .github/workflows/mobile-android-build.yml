# 1. 모바일 안드로이드 빌드 워크플로우
name: Mobile Android Build

# 2. 트리거 조건 설정
on:
  pull_request:
    types: [labeled, unlabeled, synchronize]  # 라벨 변경, 코드 동기화 시 실행
    branches: [develop, main]                 # develop/main 브랜치로의 PR에서만 실행
    paths:                                    # 모바일 관련 파일 변경 시에만 실행
      - 'frontend/mobile/**'
      - '.github/workflows/mobile-android-build.yml'

jobs:
  build:
    # 3. 모바일 관련 파일이 변경되었을 때 실행
    # 라벨이 있으면 우선 실행, 없어도 모바일 파일 변경 시 실행
    if: contains(github.event.pull_request.labels.*.name, 'frontend-mobile') || contains(github.event.pull_request.labels.*.name, 'mobile')
    
    runs-on: ubuntu-latest
    
    # 4. 환경 변수 설정
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk
      GRADLE_OPTS: -Xmx6144m -XX:MaxMetaspaceSize=2048m  # Gradle 메모리 설정
      NODE_OPTIONS: --max-old-space-size=4096 # Node.js 메모리 설정
    
    steps:
      # 5. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 5-1. 서브모듈 권한 설정 및 업데이트
      - name: Configure Git for submodules
        run: |
          # Personal Access Token 존재 여부 확인
          if [ -z "${{ secrets.PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "PERSONAL_ACCESS_TOKEN is not set!"
            echo "Please set PERSONAL_ACCESS_TOKEN in repository secrets"
            exit 1
          else
            echo "PERSONAL_ACCESS_TOKEN is set"
          fi
          
          # Git 인증 설정
          git config --global url."https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
          # Personal Access Token 권한 테스트
          echo "Testing Personal Access Token permissions..."
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/8llow8llowMe/TripMarble-env)
          echo "API Response: $RESPONSE"
          
          # 서브모듈 수동 업데이트
          echo "Updating submodules..."
          git submodule sync --recursive
          git submodule update --init --recursive --force
          
          # 서브모듈 상태 확인
          echo "Submodule status:"
          git submodule status
      
      # 6. Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'                                    # Yarn 캐시 사용
          cache-dependency-path: 'frontend/mobile/yarn.lock'
      
      # 7. Java 환경 설정 (Android 빌드용)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' 
      
      # 8. Android SDK 설정
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk-version: 27.1.12297006
          cmake-version: 3.22.1
      
      # 9. 의존성 설치
      - name: Install dependencies
        working-directory: frontend/mobile
        run: yarn install --frozen-lockfile  # lockfile 기반으로 정확한 버전 설치
      
      # 10. 빌드 환경 설정
      - name: Setup build environment
        working-directory: frontend/mobile
        run: |
          # 타겟 브랜치에 따라 환경 설정
          if [ "${{ github.base_ref }}" = "main" ]; then
            ENV_FILE="env/.env-frontend-mobile-prod"
            BUILD_TYPE="release"  # main 브랜치 = 프로덕션 빌드
          else
            ENV_FILE="env/.env-frontend-mobile-dev"
            BUILD_TYPE="debug"    # develop 브랜치 = 개발 빌드
          fi
          
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          
          # 환경 파일 존재 확인
          if [ ! -f "$ENV_FILE" ]; then
            echo "Environment file not found: $ENV_FILE"
            echo "Available files:"
            ls -la env/ || echo "env directory not found"
            exit 1
          fi
          echo "Environment file found: $ENV_FILE"
      
      # 11. Expo Prebuild (네이티브 코드 생성)
      - name: Prebuild
        working-directory: frontend/mobile
        run: |
          # 기존 네이티브 폴더 제거
          rm -rf android ios
          
          # Android 플랫폼용 네이티브 코드 생성
          npx expo prebuild --platform android --clean
          
          # Gradle wrapper 실행 권한 부여
          chmod +x android/gradlew
          
          # React Native 설정 추가 (Hermes 엔진 활성화)
          if [ -f android/app/build.gradle ]; then
            # 기존 React 설정 제거
            sed -i '/project\.ext\.react = \[/,/^\]/d' android/app/build.gradle
            sed -i '/^react {/,/^}/d' android/app/build.gradle
            
            # React 플러그인 라인 찾기
            PLUGIN_LINE=$(grep -n "apply plugin: \"com.facebook.react\"" android/app/build.gradle | cut -d: -f1)
            if [ ! -z "$PLUGIN_LINE" ]; then
              # Hermes 엔진 활성화 설정 추가 (임시 파일 사용)
              cp android/app/build.gradle android/app/build.gradle.tmp
              head -n $PLUGIN_LINE android/app/build.gradle.tmp > android/app/build.gradle
              echo "" >> android/app/build.gradle
              echo "react {" >> android/app/build.gradle
              echo "    hermesEnabled = true" >> android/app/build.gradle
              echo "}" >> android/app/build.gradle
              tail -n +$((PLUGIN_LINE + 1)) android/app/build.gradle.tmp >> android/app/build.gradle
              rm android/app/build.gradle.tmp
            fi
          fi
          
          # Android 테마 설정 수정 (EdgeToEdge 오류 해결)
          if [ -f android/app/src/main/res/values/styles.xml ]; then
            echo "Fixing Android theme configuration..."
            # EdgeToEdge 테마를 기본 테마로 변경
            sed -i 's/Theme.EdgeToEdge/Theme.AppCompat.Light.NoActionBar/g' android/app/src/main/res/values/styles.xml
            sed -i 's/Theme.EdgeToEdge/Theme.AppCompat.Light.NoActionBar/g' android/app/src/main/res/values-night/styles.xml 2>/dev/null || true
            echo "Android theme configuration fixed"
          fi
          
          # AndroidManifest.xml에서 EdgeToEdge 설정 제거
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Updating AndroidManifest.xml..."
            # EdgeToEdge 관련 속성 제거
            sed -i '/android:enableOnBackInvokedCallback/d' android/app/src/main/AndroidManifest.xml
            sed -i '/android:windowSoftInputMode/d' android/app/src/main/AndroidManifest.xml
            echo "AndroidManifest.xml updated"
          fi
          
          # Gradle 빌드 설정
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m" > android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties
          echo "org.gradle.configureondemand=true" >> android/gradle.properties
          echo "org.gradle.caching=true" >> android/gradle.properties
          echo "org.gradle.workers.max=4" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "hermesEnabled=true" >> android/gradle.properties
          echo "newArchEnabled=false" >> android/gradle.properties
          echo "NODE_BINARY=$(which node)" >> android/gradle.properties
          
          # Android SDK 경로 설정
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      
      # 12. Android 앱 빌드
      - name: Build Android
        working-directory: frontend/mobile/android
        run: |
          # 빌드 타입에 따른 태스크 및 출력 경로 설정
          if [ "${{ env.BUILD_TYPE }}" = "release" ]; then
            BUILD_TASK="bundleRelease"  # AAB 파일 생성 (Google Play 배포용)
            OUTPUT_PATH="app/build/outputs/bundle/release/app-release.aab"
          else
            BUILD_TASK="assembleDebug"  # APK 파일 생성 (테스트용)
            OUTPUT_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          echo "Building ${{ env.BUILD_TYPE }} ($BUILD_TASK)"
          
          # Gradle 빌드 실행
          ./gradlew clean $BUILD_TASK \
            --no-daemon \
            --parallel \
            --max-workers=4 \
            --stacktrace \
            -x test -x lint -x check -x verify  # 테스트 및 검증 단계 건너뛰기
          
          # 빌드 결과 확인
          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "✗ Build failed"
            find app/build/outputs -name "*.apk" -o -name "*.aab" 2>/dev/null || true
            exit 1
          fi
          
          echo "✓ Build successful"
          ls -lh "$OUTPUT_PATH"
          echo "OUTPUT_PATH=$OUTPUT_PATH" >> $GITHUB_ENV
      
      # 13. Debug APK 업로드 (아티팩트)
      - name: Upload APK (Debug)
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.event.number }}
          path: frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7  # 7일간 보관
      
      # 14. Release AAB 업로드 (아티팩트)
      - name: Upload AAB (Release)
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.event.number }}
          path: frontend/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30  # 30일간 보관
      
      # 15. Google Play Store 배포 (Release만)
      - name: Deploy to Google Play (Release only)
        if: env.BUILD_TYPE == 'release' && github.base_ref == 'main'
        working-directory: frontend/mobile
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Google Play 서비스 계정 키 파일 생성
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
          
          # Fastlane 설치
          gem install fastlane
          
          # Google Play Store에 AAB 파일 업로드
          fastlane supply \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track production \
            --json_key google-play-service-account.json \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots
          
          # 임시 파일 정리
          rm -f google-play-service-account.json
      
      # 16. PR에 빌드 결과 댓글 작성
      - name: Comment PR with build results
        if: always()  # 성공/실패 관계없이 항상 실행
        uses: actions/github-script@v7
        with:
          script: |
            const buildType = process.env.BUILD_TYPE;
            const buildStatus = '${{ job.status }}';
            const artifactName = buildType === 'release' ? 'app-release-${{ github.event.number }}' : 'app-debug-${{ github.event.number }}';
            
            // 빌드 결과 댓글 생성
            let comment = '## Mobile Build Results\\n\\n';
            comment += '**Build Type:** ' + buildType + '\\n';
            comment += '**Target Branch:** ${{ github.base_ref }}\\n';
            comment += '**Status:** ' + (buildStatus === 'success' ? 'Success' : 'Failed') + '\\n\\n';
            
            if (buildStatus === 'success') {
              comment += '**Artifact:** ' + artifactName + '\\n';
              comment += '**Download:** Check the Actions tab for download link\\n\\n';
              comment += buildType === 'debug' ? 
                '> Debug build completed. Ready for testing.\\n' : 
                '> Release build completed. Ready for production deployment.\\n';
            } else {
              comment += '> Build failed. Check the Actions tab for details.\\n';
            }
            
            // PR에 댓글 작성
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
