# .github/workflows/mobile-android-build.yml
name: Mobile Android Build

on:
  pull_request:
    types: [labeled, unlabeled, synchronize] # 1. PR 라벨 변경/동기화 시 실행
    branches: [develop, main] # 2. develop, main 브랜치 PR에서만 실행
    paths: # 3. 모바일 관련 코드 변경 시 실행
      - 'frontend/mobile/**'
      - '.github/workflows/mobile-android-build.yml'

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'frontend-mobile') || contains(github.event.pull_request.labels.*.name, 'mobile')
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk
      GRADLE_OPTS: -Xmx6144m -XX:MaxMetaspaceSize=2048m
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'frontend/mobile/yarn.lock'

      # 3. Java 설치
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Android SDK 설치
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk-version: 27.1.12297006
          cmake-version: 3.22.1

      # 5. Yarn 의존성 설치
      - name: Install dependencies
        working-directory: frontend/mobile
        run: yarn install --frozen-lockfile

      # 6. 빌드 타입 및 환경 설정
      - name: Setup build environment
        working-directory: frontend/mobile
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            BUILD_TYPE="release"
            APP_ENV="production"
          else
            BUILD_TYPE="debug"
            APP_ENV="development"
          fi
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "APP_ENV=$APP_ENV" >> $GITHUB_ENV

      # 7. Keystore 복원
      - name: Restore Keystore
        working-directory: frontend/mobile
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/tripmarble-release-key.jks
          ls -lh android/app/tripmarble-release-key.jks

      - name: Debug Keystore Env
        run: |
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"

      # 8. 안드로이드 빌드
      - name: Build Android
        working-directory: frontend/mobile/android
        run: |
          chmod +x gradlew
           
          if [ "${{ env.BUILD_TYPE }}" = "release" ]; then
            BUILD_TASK="bundleRelease"
            OUTPUT_PATH="app/build/outputs/bundle/release/app-release.aab"
          else
            BUILD_TASK="assembleDebug"
            OUTPUT_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi

          echo "Building ${{ env.BUILD_TYPE }} ($BUILD_TASK) with APP_ENV=${{ env.APP_ENV }}"
          ./gradlew clean $BUILD_TASK --no-daemon --stacktrace -x test -x lint -x check -x verify

          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "✗ Build failed"
            exit 1
          fi

          echo "✓ Build successful"
          ls -lh "$OUTPUT_PATH"
          echo "OUTPUT_PATH=$OUTPUT_PATH" >> $GITHUB_ENV

      # 9. APK 업로드 (Debug 전용)
      - name: Upload APK (Debug)
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.event.number }}
          path: frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 10. AAB 업로드 (Release 전용)
      - name: Upload AAB (Release)
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.event.number }}
          path: frontend/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # 11. Google Play 업로드 (open 트랙)
      - name: Deploy to Google Play (Open Track)
        if: env.BUILD_TYPE == 'release' && github.base_ref == 'main'
        working-directory: frontend/mobile
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
          gem install fastlane --no-document --user-install
          echo "$HOME/.gem/ruby/3.2.0/bin" >> $GITHUB_PATH
          fastlane supply \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track open \
            --json_key google-play-service-account.json \
            --package_name com.followfollowme.tripmarble \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots
          rm -f google-play-service-account.json
