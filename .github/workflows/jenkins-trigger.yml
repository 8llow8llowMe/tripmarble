name: Jenkins Auth Test

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]
    branches: [develop, main]

jobs:
  test-jenkins-auth:
    runs-on: ubuntu-latest
    steps:
    - name: Test Jenkins Authentication
      run: |
        echo "=== Jenkins Authentication Test ==="
        
        # Secrets 존재 여부 확인
        echo "JENKINS_URL exists: $([[ -n '${{ secrets.JENKINS_URL }}' ]] && echo 'YES' || echo 'NO')"
        echo "JENKINS_USER exists: $([[ -n '${{ secrets.JENKINS_USER }}' ]] && echo 'YES' || echo 'NO')"
        echo "JENKINS_TOKEN exists: $([[ -n '${{ secrets.JENKINS_TOKEN }}' ]] && echo 'YES' || echo 'NO')"
        
        if [[ -z '${{ secrets.JENKINS_USER }}' ]]; then
          echo "❌ JENKINS_USER secret is missing!"
          echo "Please add JENKINS_USER to GitHub Secrets"
          exit 1
        fi
        
        if [[ -z '${{ secrets.JENKINS_TOKEN }}' ]]; then
          echo "❌ JENKINS_TOKEN secret is missing!"
          exit 1
        fi
        
        # 1. Jenkins 서버 기본 연결 테스트
        echo "=== Testing Jenkins Server Connection ==="
        server_response=$(curl -s -w "HTTP:%{http_code}" -I "$JENKINS_URL")
        echo "Server response: $server_response"
        
        # 2. 인증 테스트 (whoAmI API)
        echo "=== Testing Authentication ==="
        auth_response=$(curl -s -w "HTTP:%{http_code}" \
          --user "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/me/api/json")
        
        auth_http_code=$(echo "$auth_response" | grep -o 'HTTP:[0-9]*' | cut -d: -f2)
        auth_body=$(echo "$auth_response" | sed 's/HTTP:[0-9]*$//')
        
        echo "Auth API Response (HTTP $auth_http_code):"
        if [[ "$auth_http_code" == "200" ]]; then
          echo "✅ Authentication successful!"
          echo "User info: $(echo "$auth_body" | head -c 200)"
        else
          echo "❌ Authentication failed!"
          echo "Response: $(echo "$auth_body" | head -c 300)"
        fi
        
        # 3. Job 존재 확인
        echo "=== Testing Job Access ==="
        job_response=$(curl -s -w "HTTP:%{http_code}" \
          --user "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/job/auth-service/api/json")
        
        job_http_code=$(echo "$job_response" | grep -o 'HTTP:[0-9]*' | cut -d: -f2)
        
        if [[ "$job_http_code" == "200" ]]; then
          echo "✅ Job access successful!"
        else
          echo "❌ Job access failed (HTTP: $job_http_code)"
        fi
        
        # 4. 다른 인증 방법들 테스트
        echo "=== Testing Alternative Auth Methods ==="
        
        # Bearer Token 방식
        echo "Testing Bearer token..."
        bearer_response=$(curl -s -w "HTTP:%{http_code}" \
          -H "Authorization: Bearer $JENKINS_TOKEN" \
          "$JENKINS_URL/me/api/json")
        bearer_code=$(echo "$bearer_response" | grep -o 'HTTP:[0-9]*' | cut -d: -f2)
        echo "Bearer auth result: HTTP $bearer_code"
        
        # API Key 방식
        echo "Testing API key in URL..."
        apikey_response=$(curl -s -w "HTTP:%{http_code}" \
          "$JENKINS_URL/me/api/json?token=$JENKINS_TOKEN")
        apikey_code=$(echo "$apikey_response" | grep -o 'HTTP:[0-9]*' | cut -d: -f2)
        echo "API key auth result: HTTP $apikey_code"