name: Jenkins Trigger

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]
    branches: [develop, main]

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
    - name: Check and trigger Jenkins
      run: |
        action="${{ github.event.action }}"
        labels="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        target_branch="${{ github.event.pull_request.base.ref }}"      # develop 또는 main
        pr_branch="${{ github.event.pull_request.head.ref }}"          # PR 소스 브랜치 (실제 변경사항)
        pr_sha="${{ github.event.pull_request.head.sha }}"             # PR의 최신 커밋 SHA
        
        # 트리거 조건 체크
        should_trigger=false
        
        if [[ "$action" == "labeled" || "$action" == "unlabeled" ]]; then
          should_trigger=true
          echo "Trigger: Label changed"
        elif [[ "$action" == "synchronize" && ("$labels" == *"backend-"* || "$labels" == *"frontend-"*) ]]; then
          # 최근 1시간 이내 push만 허용
          commit_time=$(date -d "${{ github.event.pull_request.head.repo.pushed_at }}" +%s)
          current_time=$(date -u +%s)
          if [[ $((current_time - commit_time)) -lt 3600 ]]; then
            should_trigger=true
            echo "Trigger: Recent push with service labels"
          else
            echo "Skip: Old push"
          fi
        else
          echo "Skip: No service labels or unsupported action"
        fi
        
        # Jenkins 트리거 실행
        if [[ "$should_trigger" == "true" ]]; then
          echo "Labels: $labels | Target: $target_branch | PR Branch: $pr_branch | PR SHA: $pr_sha"
          
          JENKINS_URL="${{ secrets.JENKINS_URL }}"
          JENKINS_USER="${{ secrets.JENKINS_USER }}"
          JENKINS_TOKEN="${{ secrets.JENKINS_TOKEN }}"
          JENKINS_URL="${JENKINS_URL%/}"
          
          # 서비스 트리거 함수 (PR의 최신 코드로 빌드, 타겟 환경으로 배포)
          trigger_service() {
            local job_name="$1"
            local service_group="$2"
            local service_name="$3"
            
            echo "Triggering: $job_name with PR SHA: $pr_sha"
            
            # Jenkins 파이프라인에 PR_SHA와 TARGET_BRANCH 전달
            response=$(curl -s -w "HTTP_CODE:%{http_code}" -X POST \
              --user "$JENKINS_USER:$JENKINS_TOKEN" \
              "$JENKINS_URL/job/$job_name/buildWithParameters" \
              --data-urlencode "SERVICE_GROUP=$service_group" \
              --data-urlencode "SERVICE_NAME=$service_name" \
              --data-urlencode "PR_SHA=$pr_sha" \
              --data-urlencode "TARGET_BRANCH=$target_branch")
            
            http_code=$(echo "$response" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
            
            if [[ "$http_code" == "201" || "$http_code" == "200" ]]; then
              echo "SUCCESS: $service_name triggered with PR SHA: $pr_sha"
            else
              echo "FAILED: $service_name (HTTP: $http_code)"
              echo "Response: $response"
            fi
          }
          
          # 라벨 기반 서비스 트리거
          [[ "$labels" == *"backend-auth-service"* ]] && trigger_service "tripmarble-backend-auth-service" "service" "auth-service"
          [[ "$labels" == *"backend-trip-service"* ]] && trigger_service "tripmarble-backend-trip-service" "service" "trip-service"
          [[ "$labels" == *"backend-trip-game-service"* ]] && trigger_service "tripmarble-backend-trip-game-service" "service" "trip-game-service"
          [[ "$labels" == *"backend-api-gateway"* ]] && trigger_service "tripmarble-backend-api-gateway" "cloud" "api-gateway"
          [[ "$labels" == *"backend-service-discovery"* ]] && trigger_service "tripmarble-backend-service-discovery" "cloud" "service-discovery"
          
          echo "Jenkins trigger completed"
        fi