name: Jenkins Trigger

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]
    branches: [develop, main]

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
    - name: Check and trigger Jenkins
      run: |
        action="${{ github.event.action }}"
        labels="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        branch="${{ github.event.pull_request.base.ref }}"
        
        # 트리거 조건 체크
        should_trigger=false
        
        if [[ "$action" == "labeled" || "$action" == "unlabeled" ]]; then
          should_trigger=true
          echo "Trigger: Label changed"
        elif [[ "$action" == "synchronize" && ("$labels" == *"backend-"* || "$labels" == *"frontend-"*) ]]; then
          # 최근 1시간 이내 push만 허용
          commit_time=$(date -d "${{ github.event.pull_request.head.repo.pushed_at }}" +%s)
          current_time=$(date -u +%s)
          if [[ $((current_time - commit_time)) -lt 3600 ]]; then
            should_trigger=true
            echo "Trigger: Recent push with service labels"
          else
            echo "Skip: Old push"
          fi
        else
          echo "Skip: No service labels or unsupported action"
        fi
        
        # Jenkins 트리거
        if [[ "$should_trigger" == "true" ]]; then
          echo "Labels: $labels | Branch: $branch"
          
          # Jenkins Job 목록 확인 (디버깅용)
          echo "=== Checking available Jenkins jobs ==="
          echo "Jenkins URL: ${{ secrets.JENKINS_URL }}"
          
          jobs_response=$(curl -s -w "HTTP_CODE:%{http_code}" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/api/json?tree=jobs[name,url]")
          
          jobs_http_code=$(echo "$jobs_response" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
          jobs_body=$(echo "$jobs_response" | sed 's/HTTP_CODE:[0-9]*$//')
          
          echo "Jobs API Response Code: $jobs_http_code"
          echo "Jobs API Response Body (first 500 chars):"
          echo "$jobs_body" | head -c 500
          echo ""
          
          if [[ "$jobs_http_code" == "200" ]]; then
            echo "Available jobs:"
            echo "$jobs_body" | grep -o '"name":"[^"]*"' | sed 's/"name":"//g' | sed 's/"//g'
          else
            echo "Failed to get jobs list (HTTP: $jobs_http_code)"
            echo "Full response:"
            echo "$jobs_body"
          fi
          echo ""
          
          # Basic Auth를 사용한 안전한 트리거 방법
          trigger_service() {
            local service_name="$1"
            local service_group="$2"
            
            echo "=== Triggering $service_name ==="
            
            # Jenkins 연결 테스트
            echo "Testing Jenkins connectivity for $service_name..."
            
            # 방법 1: 멀티브랜치 파이프라인 구조 시도
            connection_test=$(curl -s -w "HTTP:%{http_code}" -I \
              --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
              "${{ secrets.JENKINS_URL }}/job/$(echo "$service_name" | sed 's/ /%20/g')/job/$branch/")
            
            echo "Connection test (method 1): $connection_test"
            
            # 방법 2: 단일 Job 구조 시도 (404인 경우)
            if [[ "$connection_test" == *"HTTP:404"* ]]; then
              echo "Trying alternative URL structure..."
              connection_test2=$(curl -s -w "HTTP:%{http_code}" -I \
                --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
                "${{ secrets.JENKINS_URL }}/job/$(echo "$service_name" | sed 's/ /%20/g')/")
              
              echo "Connection test (method 2): $connection_test2"
              
              # 방법 3: 간단한 이름으로 시도
              if [[ "$connection_test2" == *"HTTP:404"* ]]; then
                simple_name=$(echo "$service_name" | sed 's/ multi branch pipeline//g')
                echo "Trying simple name: $simple_name"
                connection_test3=$(curl -s -w "HTTP:%{http_code}" -I \
                  --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
                  "${{ secrets.JENKINS_URL }}/job/$(echo "$simple_name" | sed 's/ /%20/g')/")
                
                echo "Connection test (method 3): $connection_test3"
              fi
            fi
            
            # Basic Auth로 Jenkins 빌드 트리거 (URL 인코딩 방식)
            echo "Triggering build with parameters..."
            response=$(curl -s -w "HTTP_CODE:%{http_code}" -X POST \
              --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
              "${{ secrets.JENKINS_URL }}/job/$(echo "$service_name" | sed 's/ /%20/g')/job/$branch/buildWithParameters" \
              --data-urlencode "SERVICE_GROUP=$service_group" \
              --data-urlencode "SERVICE_NAME=$service_name" \
              --data-urlencode "SKIP_LABEL_CHECK=true")
            
            http_code=$(echo "$response" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
            body=$(echo "$response" | sed 's/HTTP_CODE:[0-9]*$//')
            
            if [[ "$http_code" == "201" || "$http_code" == "200" ]]; then
              echo "$service_name triggered successfully (HTTP: $http_code)"
            else
              echo "$service_name failed (HTTP: $http_code)"
              echo "Response preview: $(echo "$body" | head -c 200)..."
              
              # 대안: 파라미터 없이 빌드 시도
              echo "Trying build without parameters..."
              fallback_response=$(curl -s -w "HTTP_CODE:%{http_code}" -X POST \
                --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
                "${{ secrets.JENKINS_URL }}/job/$(echo "$service_name" | sed 's/ /%20/g')/job/$branch/build")
              
              fallback_code=$(echo "$fallback_response" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
              
              if [[ "$fallback_code" == "201" || "$fallback_code" == "200" ]]; then
                echo "$service_name triggered without parameters (HTTP: $fallback_code)"
              else
                echo "$service_name fallback also failed (HTTP: $fallback_code)"
              fi
            fi
            
            echo ""
          }
          
          # 서비스별 트리거 (라벨 기반 선택적 실행)
          [[ "$labels" == *"backend-auth-service"* ]] && trigger_service "tripmarble-backend-auth-service multi branch pipeline" "service"
          [[ "$labels" == *"backend-trip-service"* ]] && trigger_service "tripmarble-backend-trip-service multi branch pipeline" "service"
          [[ "$labels" == *"backend-trip-game-service"* ]] && trigger_service "tripmarble-backend-trip-game-service multi branch pipeline" "service"
          [[ "$labels" == *"backend-api-gateway"* ]] && trigger_service "tripmarble-backend-api-gateway multi branch pipeline" "cloud"
          [[ "$labels" == *"backend-service-discovery"* ]] && trigger_service "tripmarble-backend-service-discovery multi branch pipeline" "cloud"
          [[ "$labels" == *"frontend-web"* ]] && trigger_service "frontend-web" "web"
          [[ "$labels" == *"frontend-mobile"* ]] && trigger_service "frontend-mobile" "mobile"
          
          echo "Jenkins trigger completed!"
          
          # 대안: 간단한 Job 확인
          echo "=== Alternative: Simple job check ==="
          for job_name in "tripmarble-backend-auth-service multi branch pipeline" "tripmarble-backend-trip-service multi branch pipeline" "tripmarble-backend-trip-game-service multi branch pipeline" "tripmarble-backend-api-gateway multi branch pipeline" "tripmarble-backend-service-discovery multi branch pipeline"; do
            echo "Checking job: $job_name"
            simple_check=$(curl -s -w "HTTP:%{http_code}" -I \
              --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
              "${{ secrets.JENKINS_URL }}/job/$(echo "$job_name" | sed 's/ /%20/g')/")
            echo "  Result: $simple_check"
          done
        fi