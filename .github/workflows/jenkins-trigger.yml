name: Jenkins Job Test

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]
    branches: [develop, main]

jobs:
  test-jenkins-jobs:
    runs-on: ubuntu-latest
    steps:
    - name: Test Jenkins Jobs
      run: |
        action="${{ github.event.action }}"
        labels="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        branch="${{ github.event.pull_request.base.ref }}"
        
        JENKINS_URL="${{ secrets.JENKINS_URL }}"
        JENKINS_USER="${{ secrets.JENKINS_USER }}"
        JENKINS_TOKEN="${{ secrets.JENKINS_TOKEN }}"
        
        # URL 정제
        JENKINS_URL="${JENKINS_URL%/}"
        
        echo "=== Jenkins Jobs Investigation ==="
        echo "Target branch: $branch"
        echo "Labels: $labels"
        
        # 1. 모든 Job 목록 가져오기
        echo "=== Step 1: Getting all Jenkins jobs ==="
        jobs_response=$(curl -s -w "HTTP_CODE:%{http_code}" \
          --user "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/api/json?tree=jobs[name,url,_class]")
        
        jobs_http_code=$(echo "$jobs_response" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
        jobs_body=$(echo "$jobs_response" | sed 's/HTTP_CODE:[0-9]*$//')
        
        echo "Jobs API Response Code: $jobs_http_code"
        
        if [[ "$jobs_http_code" == "200" ]]; then
          echo "✅ Successfully retrieved jobs list"
          echo "Raw response (first 1000 chars):"
          echo "$jobs_body" | head -c 1000
          echo ""
          
          # Job 이름들 추출
          echo "Available job names:"
          echo "$jobs_body" | grep -o '"name":"[^"]*"' | sed 's/"name":"//g' | sed 's/"//g' | sort
          echo ""
        else
          echo "❌ Failed to get jobs list (HTTP: $jobs_http_code)"
          echo "Response: $jobs_body"
        fi
        
        # 2. 특정 Job들 개별 확인
        echo "=== Step 2: Testing specific job access ==="
        
        # 가능한 Job 이름들 테스트
        possible_jobs=(
          "auth-service"
          "trip-service" 
          "trip-game-service"
          "api-gateway"
          "service-discovery"
          "tripmarble-backend-auth-service"
          "tripmarble-backend-trip-service"
          "tripmarble-backend-trip-game-service"
          "tripmarble-backend-api-gateway"
        )
        
        for job_name in "${possible_jobs[@]}"; do
          echo "Testing job: $job_name"
          
          # Job 존재 확인
          job_response=$(curl -s -w "HTTP_CODE:%{http_code}" \
            --user "$JENKINS_USER:$JENKINS_TOKEN" \
            "$JENKINS_URL/job/$job_name/api/json")
          
          job_http_code=$(echo "$job_response" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
          
          if [[ "$job_http_code" == "200" ]]; then
            echo "  ✅ Job '$job_name' exists"
            
            # 멀티브랜치인지 확인
            job_body=$(echo "$job_response" | sed 's/HTTP_CODE:[0-9]*$//')
            if echo "$job_body" | grep -q "MultiBranchProject\|WorkflowMultiBranchProject"; then
              echo "  📁 This is a MultiBranch Pipeline"
              
              # 브랜치 확인
              branches_response=$(curl -s -w "HTTP_CODE:%{http_code}" \
                --user "$JENKINS_USER:$JENKINS_TOKEN" \
                "$JENKINS_URL/job/$job_name/api/json?tree=jobs[name]")
              
              branches_code=$(echo "$branches_response" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
              
              if [[ "$branches_code" == "200" ]]; then
                branches_body=$(echo "$branches_response" | sed 's/HTTP_CODE:[0-9]*$//')
                echo "  Available branches:"
                echo "$branches_body" | grep -o '"name":"[^"]*"' | sed 's/"name":"//g' | sed 's/"//g' | sed 's/^/    /'
                
                # develop 브랜치 존재 확인
                if echo "$branches_body" | grep -q '"name":"develop"'; then
                  echo "  ✅ 'develop' branch found!"
                  
                  # 실제 빌드 트리거 테스트
                  echo "  Testing build trigger..."
                  build_response=$(curl -s -w "HTTP_CODE:%{http_code}" -X POST \
                    --user "$JENKINS_USER:$JENKINS_TOKEN" \
                    "$JENKINS_URL/job/$job_name/job/develop/buildWithParameters" \
                    --data-urlencode "SERVICE_GROUP=service" \
                    --data-urlencode "SERVICE_NAME=$job_name" \
                    --data-urlencode "SKIP_LABEL_CHECK=true")
                  
                  build_code=$(echo "$build_response" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
                  build_body=$(echo "$build_response" | sed 's/HTTP_CODE:[0-9]*$//')
                  
                  echo "  Build trigger result: HTTP $build_code"
                  
                  if [[ "$build_code" == "201" || "$build_code" == "200" ]]; then
                    echo "  🎉 BUILD TRIGGERED SUCCESSFULLY!"
                  else
                    echo "  ❌ Build trigger failed"
                    echo "  Response: $(echo "$build_body" | head -c 200)"
                  fi
                else
                  echo "  ❌ 'develop' branch not found"
                fi
              fi
            else
              echo "  📄 This is a regular Job (not MultiBranch)"
            fi
            
          elif [[ "$job_http_code" == "404" ]]; then
            echo "  ❌ Job '$job_name' not found"
          else
            echo "  ❌ Job '$job_name' access failed (HTTP: $job_http_code)"
          fi
          
          echo ""
        done
        
        echo "=== Testing Complete ==="