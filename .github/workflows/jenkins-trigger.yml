name: Jenkins Trigger

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [develop, main]
    paths-ignore:
      - 'frontend/mobile/**'
      - '.github/workflows/**'

  push:
    branches: [develop, main]
    paths-ignore:
      - 'frontend/mobile/**'
      - '.github/workflows/**'

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jenkins Multibranch Pipeline
        env:
          JENKINS_URL:   ${{ secrets.JENKINS_URL }}
          JENKINS_USER:  ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          MBP_PREFIX:    "tripmarble"
        shell: bash
        run: |
          set -euo pipefail
          JENKINS_URL="${JENKINS_URL%/}"

          # 1. CSRF Crumb 발급
          crumb() {
            curl -s "$JENKINS_URL/crumbIssuer/api/json" \
              --user "$JENKINS_USER:$JENKINS_TOKEN" \
              | grep -oP '(?<="crumb":")[^"]*' || true
          }

          # 2. Jenkins 빌드 트리거 함수
          trigger_pr_build() {
            local JOB_URL="$1"
            local SCAN_URL="$2"
            local CRUMB="$(crumb)"
            local HDR=()
            [[ -n "$CRUMB" ]] && HDR=(-H "Jenkins-Crumb:$CRUMB")

            echo "Trigger $JOB_URL/build"
            local HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              --user "$JENKINS_USER:$JENKINS_TOKEN" "${HDR[@]}" \
              "$JOB_URL/build")

            if [[ "$HTTP_CODE" == "400" ]]; then
              echo "Job not buildable (HTTP 400) → 상태 점검 및 복구 시도..."
              local STATUS_JSON=$(curl -s --user "$JENKINS_USER:$JENKINS_TOKEN" "$JOB_URL/api/json")
              local DISABLED=$(echo "$STATUS_JSON" | grep -o '"disabled":[^,]*' | cut -d':' -f2 | tr -d ' ')
              local BUILDABLE=$(echo "$STATUS_JSON" | grep -o '"buildable":[^,]*' | cut -d':' -f2 | tr -d ' ')

              # disabled=true → enable API 호출
              if [[ "$DISABLED" == "true" ]]; then
                echo "Job is disabled → enabling job..."
                curl -s -X POST \
                  --user "$JENKINS_USER:$JENKINS_TOKEN" \
                  "${HDR[@]}" \
                  "$JOB_URL/enable"
                sleep 5
              fi

              # buildable=false → re-index (change request 갱신)
              if [[ "$BUILDABLE" == "false" ]]; then
                echo "Job found but not buildable → re-indexing repo..."
                curl -s -X POST --user "$JENKINS_USER:$JENKINS_TOKEN" "$SCAN_URL"
                sleep 15
              fi

              # enable 후 재시도 (최대 3회)
              for i in {1..3}; do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                  --user "$JENKINS_USER:$JENKINS_TOKEN" "${HDR[@]}" \
                  "$JOB_URL/build?delay=0sec")
                [[ "$HTTP_CODE" == "201" ]] && break
                sleep 10
              done
            fi

            echo "Final HTTP_CODE: $HTTP_CODE"
          }

          # 3. 라벨별 서비스 매핑
          map_services() {
            local labels="$1"
            svcs=()
            if [[ "$labels" == *"backend-auth-service"* ]]; then svcs+=("auth-service:backend:service"); fi
            if [[ "$labels" == *"backend-trip-service"* ]]; then svcs+=("trip-service:backend:service"); fi
            if [[ "$labels" == *"backend-trip-game-service"* ]]; then svcs+=("trip-game-service:backend:service"); fi
            if [[ "$labels" == *"backend-api-gateway"* ]]; then svcs+=("api-gateway:backend:cloud"); fi
            if [[ "$labels" == *"backend-service-discovery"* ]]; then svcs+=("service-discovery:backend:cloud"); fi
            if [[ "$labels" == *"frontend-web"* ]]; then svcs+=("web:frontend:web"); fi
          }

          # 4. 이벤트별 분기 (PR / Push)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
            HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            LABELS="$(printf "%s " ${{ join(github.event.pull_request.labels.*.name, ' ') }})"

            echo "PR 이벤트 감지 → #${PR_NUMBER} (${HEAD_BRANCH} → ${BASE_BRANCH})"
            map_services "$LABELS"
            [[ ${#svcs[@]} -eq 0 ]] && { echo "관련 라벨 없음 → Jenkins 빌드 스킵"; exit 0; }

            TARGET_BRANCH="$BASE_BRANCH"
            echo "TARGET_BRANCH = $TARGET_BRANCH"

            for svc in "${svcs[@]}"; do
              IFS=":" read -r NAME GROUP TYPE <<< "$svc"
              MBP="${MBP_PREFIX}-${GROUP}-${NAME}"
              JOB_URL="$JENKINS_URL/job/$MBP/view/change-requests/job/PR-$PR_NUMBER"
              SCAN_URL="$JENKINS_URL/job/$MBP/build?delay=0"

              echo "Checking existence of $JOB_URL ..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                --user "$JENKINS_USER:$JENKINS_TOKEN" "$JOB_URL/api/json")

              if [[ "$HTTP_CODE" == "404" ]]; then
                echo "No PR job found → Triggering repo scan for $MBP"
                curl -s -X POST --user "$JENKINS_USER:$JENKINS_TOKEN" "$SCAN_URL"
                echo "Waiting 15s for indexing..."
                sleep 15
              fi

              echo "Triggering PR job build → $JOB_URL"
              trigger_pr_build "$JOB_URL" "$SCAN_URL"
            done

          else
            BRANCH="${{ github.ref_name }}"
            TARGET_BRANCH="$BRANCH"
            echo "Push 이벤트 감지 → 브랜치: $BRANCH"

            svcs=(
              "auth-service:backend:service"
              "trip-service:backend:service"
              "trip-game-service:backend:service"
              "api-gateway:backend:cloud"
              "service-discovery:backend:cloud"
              "web:frontend:web"
            )

            for svc in "${svcs[@]}"; do
              IFS=":" read -r NAME GROUP TYPE <<< "$svc"
              MBP="${MBP_PREFIX}-${GROUP}-${TYPE}-${NAME}"
              JOB_URL="$JENKINS_URL/job/$MBP/job/$BRANCH"
              echo "Trigger Branch-job: $MBP ($BRANCH)"
              trigger_pr_build "$JOB_URL" "$JOB_URL"
            done
          fi

          echo ""
          echo "Jenkins Trigger Completed."
