server:
  port: ${AUTH_SERVICE_PORT}
  shutdown: graceful

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: true
    defer-datasource-initialization: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: true
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 100

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}

eureka:
  instance:
    hostname: ${spring.application.name}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://${SERVICE_DISCOVERY_HOSTNAME}:${SERVICE_DISCOVERY_PORT}/eureka/
    # Prefix 매칭 활성화
    fetch-registry: true
    registry-fetch-interval-seconds: 5

# Snowflake
snowflake:
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID}
  worker-id: ${SNOWFLAKE_WORKER_ID}

# JWT 설정
jwt:
  access-key: ${JWT_ACCESS_KEY}
  refresh-key: ${JWT_REFRESH_KEY}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

# Minio 설정
minio:
  url: ${MINIO_URL}
  bucket-prefix: ${MINIO_BUCKET_PREFIX}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

# Mail 설정
mail:
  host: ${MAIL_HOST}
  port: ${MAIL_PORT}
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  smtp-auth: ${MAIL_SMTP_AUTH}
  starttls-enable: ${MAIL_STARTTLS_ENABLE}

# Swagger
swagger:
  server-url: http://${TRIP_MARBLE_DOMAIN}:${API_GATEWAY_PORT}/auth-service

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "health,info" # 해당 actuator endpoint 노출
  endpoint:
    health:
      show-details: ALWAYS # SBA에서 상세 health 정보까지 보기 위함
