x-trip-service-environment: &trip_service_environment
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  TIME_ZONE: ${TIME_ZONE}
  SPRING_APPLICATION_NAME: ${TRIP_SERVICE_APP_NAME}
  TRIP_SERVICE_PORT: ${TRIP_SERVICE_PORT}
  DB_URL: ${DB_URL}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE}
  MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE}
  REDIS_MODE: ${REDIS_MODE}
  REDIS_MASTER_NAME: ${REDIS_MASTER_NAME}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_SENTINEL_1_HOST: ${REDIS_SENTINEL_1_HOST}
  REDIS_SENTINEL_1_PORT: ${REDIS_SENTINEL_1_PORT}
  REDIS_SENTINEL_2_HOST: ${REDIS_SENTINEL_2_HOST}
  REDIS_SENTINEL_2_PORT: ${REDIS_SENTINEL_2_PORT}
  REDIS_SENTINEL_3_HOST: ${REDIS_SENTINEL_3_HOST}
  REDIS_SENTINEL_3_PORT: ${REDIS_SENTINEL_3_PORT}
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  SNOWFLAKE_DATACENTER_ID: ${SNOWFLAKE_DATACENTER_ID}
  SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID}
  JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}
  AUTH_SERVICE_APP_NAME: ${AUTH_SERVICE_APP_NAME}
  MINIO_INTERNAL_URL: ${MINIO_INTERNAL_URL}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
  MINIO_BUCKET_PREFIX: ${MINIO_BUCKET_PREFIX}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  trip-service-dev:
    container_name: trip-service-dev
    build:
      context: .
      dockerfile: trip-service.Dockerfile
    ports:
      - '${TRIP_SERVICE_PORT_DEV}:${TRIP_SERVICE_PORT}' # host:container
    environment:
      <<: *trip_service_environment
      TRIP_MARBLE_DOMAIN: ${TRIP_MARBLE_DOMAIN_DEV}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT_DEV}
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  trip-service-prod:
    container_name: trip-service-prod
    build:
      context: .
      dockerfile: trip-service.Dockerfile
    ports:
      - '${TRIP_SERVICE_PORT_PROD}:${TRIP_SERVICE_PORT}' # host:container
    environment:
      <<: *trip_service_environment
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
